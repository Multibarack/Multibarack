apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "platform-api.fullname" . }}-defaults
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
