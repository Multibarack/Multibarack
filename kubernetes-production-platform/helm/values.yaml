replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.29-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: platform-api.local

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

security:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

config:
  appEnv: production
  logLevel: info
