name: Kubernetes Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes Platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes-production-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint ./helm

      - name: Render Helm manifests
        run: |
          helm template platform-api ./helm \
            --namespace platform \
            > /tmp/platform-api-rendered.yaml

      - name: Validate rendered manifests
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp

          /tmp/kubeconform \
            -strict \
            -summary \
            /tmp/platform-api-rendered.yaml

      - name: Validate repository scripts
        run: |
          bash -n scripts/create-cluster.sh
          bash -n scripts/deploy.sh
          bash -n scripts/destroy.sh
          bash -n scripts/install-metrics-server.sh
          bash -n scripts/test.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install YAML validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Check YAML syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          try:
              import yaml
          except ImportError:
              print("PyYAML is not available")
              sys.exit(1)

          files = list(pathlib.Path(".").rglob("*.yaml")) + \
                  list(pathlib.Path(".").rglob("*.yml"))

          for path in files:
              with path.open() as f:
                  list(yaml.safe_load_all(f))

              print(f"OK: {path}")
          PY

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: kubernetes-production-platform
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
